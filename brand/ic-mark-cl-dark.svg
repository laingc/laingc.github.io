<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 132 132" width="132" height="132" role="img" aria-label="Christopher Laing - CL mark (dark)">
<title>Christopher Laing - CL mark (dark)</title>
<desc>A faint Copper graph-paper grid in tenths, with stronger lines at 0.5 and the closing edges, behind square axes, the Integrated cadence ROC curve from corner to corner, the Copper operating point, and the initials CL in IBM Plex Mono Light, converted to outlines, in the ink colour. The initials sit on the grid between 0.6 and 0.9 in the bottom-right quadrant, with the L's foot inset from the right edge.</desc>
<g data-part="grid" fill="none" stroke="#C4521E" stroke-linecap="butt">
  <path data-part="grid-minor" d="M10,0V100M20,0V100M30,0V100M40,0V100M60,0V100M70,0V100M80,0V100M90,0V100M0,10H100M0,20H100M0,30H100M0,40H100M0,60H100M0,70H100M0,80H100M0,90H100" stroke-width="0.6" stroke-opacity="0.26"/>
  <path data-part="grid-major" d="M50,0V100M0,50H100M100,0V100M0,0H100" stroke-width="0.9" stroke-opacity="0.42"/>
</g>
<g data-part="symbol">
