name: Check

# Source checks for pushes and pull requests. This workflow does not deploy:
# ./deploy.sh builds locally and publishes the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prepare tools
        run: make bootstrap
      - name: Check production output
        run: make check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser checks
        run: npm run test:browser
