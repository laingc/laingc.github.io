[module.hugoVersion]
min = '0.146.7'

[params]
defaultTheme = 'light'
dateFormat = '2 January 2006'
showToc = true
showRelated = true
showPostNavigation = true
showReadingTime = true
showThemeCredit = true
homeMode = 'profile'
homePosts = 3
rssFullContent = false

[outputs]
home = ['HTML', 'RSS', 'Search']

[outputFormats.Search]
mediaType = 'application/json'
baseName = 'search'
isPlainText = true
notAlternative = true

[markup.highlight]
noClasses = false

[markup.goldmark.parser.attribute]
block = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false
