<figure class="media-figure">
  <video controls playsinline preload="metadata"{{ with .Get "poster" }} poster="{{ partial `ash/media-url.html` (dict `page` $.Page `src` .) }}"{{ end }}{{ with .Get "title" }} aria-label="{{ . }}"{{ end }}>
    <source src="{{ partial `ash/media-url.html` (dict `page` .Page `src` (.Get `src`)) }}"{{ with .Get "type" }} type="{{ . }}"{{ end }}>
    {{ with .Get "captions" }}{{ $language := partial "ash/language.html" $.Page.Language }}<track default kind="captions" src="{{ partial `ash/media-url.html` (dict `page` $.Page `src` .) }}" srclang="{{ $language.locale }}" label="{{ $language.label }}">{{ end }}
    <a href="{{ partial `ash/media-url.html` (dict `page` .Page `src` (.Get `src`)) }}">{{ i18n "videoFallback" }}</a>
  </video>
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
{{ with .Inner }}<div class="transcript">{{ . | $.Page.RenderString (dict "display" "block") }}</div>{{ end }}
