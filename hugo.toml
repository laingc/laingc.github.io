baseURL = "https://laing.nz/"
locale = "en-GB"
title = "Christopher Laing"
theme = "ash"
timeZone = "Pacific/Auckland"
enableRobotsTXT = true
pluralizeListTitles = false

[pagination]
  pagerSize = 3

[outputs]
  home = ["HTML", "RSS", "JSON", "Search"]

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[params]
  description = "Christopher Laing is a software executive combining AI and automation experience with commercial leadership."
  mainSections = ["blog"]
  defaultTheme = "dark"
  images = ["/img/about-me/WADING.jpg"]
  homePosts = 3
  showThemeCredit = false
  favicon = "brand/favicon.svg"
  faviconFallback = "brand/favicon-light.ico"
  appleTouchIcon = "brand/ic-icon-light-180.png"

  [params.author]
    name = "Christopher Laing"

  [params.brand]
    name = "Christopher Laing"
    light = "brand/ic-mark-cl-light.svg"
    dark = "brand/ic-mark-cl-dark.svg"
    smallLight = "brand/ic-mark-cl-light.svg"
    smallDark = "brand/ic-mark-cl-dark.svg"
    width = 74
    height = 74

  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/christopherlaing/"

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    files = ["! .DS_Store", "! **/.DS_Store", "! backup/**", "! **/*.gpg", "! **/*.key", "! **/*.pem"]

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Writing"
  url = "/blog/"
  weight = 3
[[menus.main]]
  name = "Categories"
  url = "/categories/"
  weight = 4
